name: CI

on:
  push:
    branches: [main]
  pull_request:

# Review Finding 12: the workflow ran on the default token scope. Nothing here writes to the
# repository, so read is all the token should be able to do.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blibli
          POSTGRES_PASSWORD: blibli
          POSTGRES_DB: blibli_talk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blibli -d blibli_talk_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blibli:blibli@localhost:5432/blibli_talk_ci?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/backend generate

      - name: Apply migrations
        run: pnpm --filter @repo/backend migrate:deploy

      - name: Seed database
        run: pnpm --filter @repo/backend seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Review Finding 12: nothing in CI looked at dependency advisories, so a known-vulnerable
  # transitive package could sit in the tree indefinitely. Separate job because it needs no
  # database and should report even when the main job is already failing on a test.
  #
  # Gated at `high`, not `moderate`: the tree carries 4 moderate advisories today, all in
  # build tooling, and a gate that is red on arrival gets ignored rather than acted on. The
  # `pnpm.overrides` block in the root package.json pins the patched versions of the five
  # packages that were high when this was added.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fails on high or critical)
        run: pnpm audit --audit-level=high

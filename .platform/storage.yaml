version: 1

# Extra application volumes (beyond database StatefulSets).
# Default accessMode is ReadWriteOnce (RWO).
# RWO volumes force Deployment strategy=Recreate and replicas=1
# (shared RWO cannot multi-attach). Use accessMode: ReadWriteMany for HA.
# Set fsGroup to the container UID that writes the volume (e.g. poros-ai=10001).
# Example for poros-ai document originals:
# fsGroup: 10001
# volumes:
#   - name: documents
#     mountPath: /var/lib/poros/documents
#     size: "10Gi"
#     accessMode: ReadWriteOnce
volumes: []
